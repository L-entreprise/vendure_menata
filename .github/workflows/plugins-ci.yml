# Plugins-only branch CI: typecheck, plugin e2e tests and dashboard build against the
# official @vendure/* npm release pinned in deploy/package.json. Never deploys anything.
name: Plugins CI

on:
    push:
        branches: [plugins]
    pull_request:
        branches: [plugins]
    workflow_dispatch:

concurrency:
    group: plugins-ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Typecheck, e2e tests, builds
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: deploy/package-lock.json

            - name: Install deploy dependencies
              working-directory: deploy
              run: npm ci --no-audit --no-fund

            # ../plugins resolve their deps from deploy/node_modules.
            - name: Expose deploy/node_modules to the plugins
              run: ln -s deploy/node_modules node_modules

            - name: Typecheck (deploy + plugins + specs)
              working-directory: deploy
              run: npx tsc --noEmit -p tsconfig.json

            - name: Plugin e2e tests
              working-directory: deploy
              run: npm run test:e2e
              env:
                  CI: true

            - name: Build dashboard
              working-directory: deploy
              run: npx vite build

            - name: Build production image
              run: docker build -f deploy/Dockerfile -t menata-vendure:plugins-ci .
