# Weekly early warning: runs the plugin checks against the LATEST published Vendure,
# ignoring the lockfile, so a breaking upstream release shows up here before a
# dependency bump reaches production. Never deploys anything.
#
# Scheduled workflows only run from the default branch (menata_branding).
name: Menata Vendure canary

on:
    schedule:
        - cron: '0 6 * * 1' # Mondays 06:00 UTC
    workflow_dispatch:

permissions:
    contents: read

jobs:
    canary:
        name: Plugins vs latest Vendure
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # Same major as the production image (deploy/Dockerfile).
                  node-version: 20
                  cache: npm
                  cache-dependency-path: deploy/package-lock.json

            - name: Install deploy dependencies
              working-directory: deploy
              run: npm ci --no-audit --no-fund

            - name: Upgrade every @vendure package to latest
              working-directory: deploy
              run: |
                  npm install --no-save --no-audit --no-fund \
                      @vendure/core@latest @vendure/common@latest @vendure/testing@latest \
                      @vendure/dashboard@latest @vendure/asset-server-plugin@latest \
                      @vendure/email-plugin@latest @vendure/graphiql-plugin@latest \
                      @vendure/job-queue-plugin@latest
                  # Not `npm ls`: --no-save leaves package.json on the pinned range, so npm ls
                  # flags the newer version as invalid and exits 1 on every new minor.
                  node -e "for (const p of ['core', 'dashboard', 'testing']) console.log('@vendure/' + p, require('@vendure/' + p + '/package.json').version)"

            - name: Expose deploy/node_modules to the plugins
              run: ln -s deploy/node_modules node_modules

            - name: Typecheck
              working-directory: deploy
              run: npx tsc --noEmit -p tsconfig.json

            - name: Plugin e2e tests
              working-directory: deploy
              run: npm run test:e2e
              env:
                  CI: true

            - name: Build dashboard
              working-directory: deploy
              run: npx vite build
